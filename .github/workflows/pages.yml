name: Deploy Web Frontend to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to deploy (for example, v0.4.5)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      API_BASE_URL: ${{ vars.SCTMGTOOL_API_BASE_URL }}

    steps:
      - name: Validate deployment inputs
        shell: python
        run: |
          import os
          import re
          from urllib.parse import urlsplit

          release_tag = os.environ["RELEASE_TAG"]
          if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", release_tag) is None:
              raise SystemExit(
                  "release_tag must be a full stable release tag such as v0.4.5"
              )

          api_base_url = os.environ.get("API_BASE_URL", "").rstrip("/")
          parsed_url = urlsplit(api_base_url)
          if (
              parsed_url.scheme != "https"
              or not parsed_url.hostname
              or parsed_url.username
              or parsed_url.password
              or parsed_url.query
              or parsed_url.fragment
          ):
              raise SystemExit(
                  "The github-pages environment variable "
                  "SCTMGTOOL_API_BASE_URL must be a public HTTPS URL"
              )

      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify checked-out release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = \
            "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"

          package_version="$(
            PYTHONPATH=src python -c \
              'import sctmgtool; print(sctmgtool.__version__)'
          )"
          test "v${package_version}" = "${RELEASE_TAG}"

      - name: Verify production backend version
        shell: python
        run: |
          import json
          import os
          from urllib.request import Request, urlopen

          api_base_url = os.environ["API_BASE_URL"].rstrip("/")
          expected_version = os.environ["RELEASE_TAG"].removeprefix("v")
          request = Request(
              f"{api_base_url}/health",
              headers={"Accept": "application/json"},
          )

          with urlopen(request, timeout=30) as response:
              if response.status != 200:
                  raise SystemExit(
                      f"Backend health check returned HTTP {response.status}"
                  )
              health = json.load(response)

          if health.get("status") != "ok":
              raise SystemExit("Backend health check did not return status ok")
          if health.get("version") != expected_version:
              raise SystemExit(
                  f"Backend version {health.get('version')!r} does not match "
                  f"release {expected_version!r}"
              )

          print(f"Backend version verified: {expected_version}")

      - name: Build static artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/github-pages"
          mkdir -p "${artifact_dir}"
          cp -R src/sctmgtool/web/static/. "${artifact_dir}/"

          ARTIFACT_DIR="${artifact_dir}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          api_base_url = os.environ["API_BASE_URL"].rstrip("/")
          config_path = Path(os.environ["ARTIFACT_DIR"]) / "config.js"
          config_path.write_text(
              "// Generated by the GitHub Pages deployment workflow.\n"
              f"window.SCTMGTOOL_API_BASE_URL = {json.dumps(api_base_url)};\n",
              encoding="utf-8",
          )
          PY

          test -f "${artifact_dir}/index.html"
          test -f "${artifact_dir}/styles.css"
          test -f "${artifact_dir}/app.js"
          test -f "${artifact_dir}/config.js"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
